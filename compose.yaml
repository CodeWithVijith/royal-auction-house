services:
  mongodb:
    image: mongo:8.0
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval 'try { if (rs.status().ok !== 1) quit(1); } catch { if (rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]}).ok !== 1) quit(1); quit(1); } if (!db.hello().isWritablePrimary) quit(1);'
      interval: 3s
      timeout: 10s
      retries: 30
volumes:
  mongo_data:
