# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Deployment configuration only: provisioning happens in the Render dashboard.
services:
  - type: web
    name: sports-auction-api
    runtime: node
    region: singapore
    plan: 0.5c-512mb
    autoDeployTrigger: 'off'
    buildCommand: corepack pnpm install --frozen-lockfile --prod=false && corepack pnpm --filter @sports/api build
    preDeployCommand: pnpm db:deploy
    startCommand: pnpm --filter @sports/api start
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: sports_auction
